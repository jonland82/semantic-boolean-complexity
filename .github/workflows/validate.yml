name: validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Compile analysis scripts
        run: python -m py_compile experiments/four_bit/scripts/*.py
      - name: Verify exact three-input regression
        run: python scripts/validate_reference.py
