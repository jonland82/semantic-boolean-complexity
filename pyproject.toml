[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-boolean-complexity"
version = "0.1.0"
description = "Exact synthesis and semantic prediction of Boolean formula complexity"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.10,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "tabulate>=0.9,<1",
]

[tool.setuptools]
packages = []
